retargeting:
  type: position_custom
  urdf_path: xhand1/xhand1_right/urdf/xhand_right.urdf

  # Target refers to the retargeting target, which is the robot hand (XHand1)
  # Wrist link name for position_custom retargeting
  wrist_link_name: "right_hand_link"

  # Target link names for position_custom retargeting (fingertips)
  target_link_names: [
    "right_hand_thumb_rota_tip",
    "right_hand_index_rota_tip",
    "right_hand_mid_tip",
    "right_hand_ring_tip",
    "right_hand_pinky_tip",
  ]

  # Human hand joint indices corresponding to each target link
  # MediaPipe hand landmarks: 4=thumb_tip, 8=index_tip, 12=middle_tip, 16=ring_tip, 20=pinky_tip
  target_link_human_indices: [ 4, 8, 12, 16, 20 ]

  # Scaling factor - adjust based on size difference between human hand and XHand1
  scaling_factor: 1.0 # for actual closing

  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
  low_pass_alpha: 0.66
